name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Try-on server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ios:
    name: iOS app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project V3_Final.xcodeproj \
            -scheme V3_Final \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            TRYON_SERVER_URL="${{ vars.TRYON_SERVER_URL }}" \
            TRYON_APP_KEY="${{ secrets.TRYON_APP_KEY }}" \
            2>&1 | tee build.log | grep -E "error:|warning: unre|\*\* BUILD|^/.*TryOn.*warning:" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
